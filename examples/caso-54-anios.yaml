# CASO DE EJEMPLO — datos inventados.
# No corresponde a ninguna persona real. Sirve para probar el motor y para
# mostrar el formato de entrada que espera `ultimo-timbre calcular`.
#
# Escenario de referencia de la US3 nº 6: completa sus 25 años de servicio a
# los 54 años de edad. Tiene cuatro años de edad por encima de los 50 que pide
# el inc. b, pero excedente CERO, porque recién ese día reúne todas las
# condiciones (Res. IPS 995/2021, Anexo, punto 2.1.a).
#
# Esperado: 75 % al habilitarse y 80 % tres años después, con la advertencia de
# que bajo la lectura literal de los arts. 42 y 43 el porcentaje inicial sería
# mayor (FR-027a, FR-027b).
