#
# T038 — GRILLA FICTICIA PARA TESTS. NO SON VALORES REALES.
#
# Los importes son redondos y evidentemente inventados, a propósito: si alguna
# vez aparecen en un informe, se reconocen de inmediato. El loader de `grids/`
# rechaza todo archivo con `ficticia: true`, así que esta grilla no puede
# valuar un informe real aunque alguien la copie allí (Principio IX).
#
# Cada cargo tiene al menos un componente bonificable y uno no bonificable,
# para que los tests de antigüedad (FR-031b) puedan distinguir la base.

