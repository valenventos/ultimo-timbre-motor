#
# T038 — GRILLA FICTICIA PARA TESTS. NO SON VALORES REALES.
#
# Los importes son redondos y evidentemente inventados, a propósito: si alguna
# vez aparecen en un informe, se reconocen de inmediato. El loader de `grids/`
# rechaza todo archivo con `ficticia: true`, así que esta grilla no puede
# valuar un informe real aunque alguien la copie allí (Principio IX).
#
# Cada cargo tiene al menos un componente bonificable y uno no bonificable,
# para que los tests de antigüedad (FR-031b) puedan distinguir la base.

version: "ficticia-test"
ficticia: true

norma:
  texto: "Grilla ficticia de prueba — no corresponde a ninguna norma salarial"
  ley: "N/A — datos inventados para tests"
enlace: null

# Acto aprobatorio ficticio. Está presente para que los tests que NO prueban la
# Cuestión del acto corran por el camino limpio; el camino sin acto se prueba
# quitándolo con `model_copy`, sin necesidad de un segundo archivo.
acto_aprobatorio:
  texto: "Acto aprobatorio ficticio — no corresponde a ningún decreto real"
  ley: "N/A — datos inventados para tests"

vigencia_desde: "2026-01-01"
