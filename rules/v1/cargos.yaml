      inciso: "b"
    estado: verificado
    regla_id: al_frente.ley_13469.extension
  - cargo: director_segunda
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: false
    naturaleza: docente
    norma:
      texto: "DL 9650/80, art. 24 inc. b (no incluido en la enumeración)"
      ley: "DL 9650/80"
      articulo: "24"
      inciso: "b"
    estado: verificado
    regla_id: al_frente.ley_13469.extension
  - cargo: director_primera
