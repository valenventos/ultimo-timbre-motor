#
# T041 — Catálogo de cargos: condición «al frente de alumnos» y naturaleza.
#
# REGLA DE DATOS APLICADA ESTRICTAMENTE:
#
#   * Los únicos cargos con `al_frente_de_alumnos: true` y `estado: verificado`
#     son los que una ley nombrada en spec.md asimila expresamente: preceptores
#     y bibliotecarios (Ley 13469), técnico-docentes de Psicología y Educación
#     Especial (Ley 10745), visitadoras de higiene escolar (Ley 11860).
#
#   * El propio art. 24 inc. b documenta dos condiciones más:
#       - los **maestros al frente directo de alumnos** (al_frente: true);
#       - los **profesores que reúnen veinte horas cátedra**, que no es un
#         booleano del cargo sino un **umbral** sobre el total de horas
#         simultáneas. El valor 20 sale de la regla `requisitos.art24.inc_b`,
#         nunca del catálogo ni del código (Principio I).
#
#   * **Director y vicedirector** son `al_frente_de_alumnos: false` por la letra
#     del art. 24 inc. b, que enumera a quiénes alcanza y no los incluye. La
#     entrada queda `verificado`, pero **condicionada** por la extensión
#     discutida de la Ley 13469 (Cuestión abierta #8), cuyo impacto es **al
#     alza**: si la extensión alcanzara, el acceso pasaría del art. 41 (70 %) al
#     art. 43 (75 %).
#
#   * `jerarquia: null` en todos: el criterio de comparación entre cargos es la
#     Cuestión abierta #4 y no hay ningún orden numérico documentado.

reglas:
  - id: al_frente.ley_13469.extension
    norma:
      texto: "Ley 13469 — extensión a otros cargos del escalafón"
      ley: "Ley 13469"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: al_alza
    que_falta_verificar: >-
      si la Ley 13469 alcanza a cargos del escalafón no nombrados expresamente
      en ella —entre ellos director y vicedirector—. La interpretación está
      discutida (SCBA, causa A 74801, 2020). Si alcanzara, el acceso pasaría de
      los incisos c y d (art. 41, 70 % de base) al inciso b (art. 43, 75 % de
      base): por eso el sentido del impacto es al alza.
    magnitud_estimada: "70 % (art. 41, incs. c y d) contra 75 % (art. 43, inc. b) de base"
    cuestion_abierta: 8
    valor: null

  - id: al_frente.cargo_sin_norma_expresa
    norma:
      texto: "Nomenclador de cargos docentes y decretos paritarios vigentes — a relevar"
      ley: "Nomenclador de cargos docentes"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    que_falta_verificar: >-
      la condición de «al frente de alumnos» y la naturaleza del servicio de los
      cargos del escalafón general. Ninguna norma citada en spec.md ni en la
      constitución las documenta, así que no se asumen. Se releva del
      Nomenclador de cargos docentes.
    cuestion_abierta: 8
    valor: null

# ---------------------------------------------------------------------------
# Entradas del catálogo
# ---------------------------------------------------------------------------
#
# Cada entrada es un cargo **con su categoría**, tal como lo distingue el
# nomenclador (Decreto 1301/2005, Anexo I «Nomenclador de cargos docentes»,
# https://normas.gba.gob.ar/documentos/xaE1dU4x.html). No hay un cargo
# «director» genérico porque el nomenclador no lo tiene: distingue Director de
# Primera, de Segunda y de Tercera, con índices distintos según la categoría
# del establecimiento. Un cargo genérico obligaría a elegir uno de los tres y
# el informe no podría decir cuál eligió.
#
# `indice_escalafonario` está en **null en todas** las entradas: el Anexo del
# art. 9º del Decreto 2397/2005, que aprueba el texto ordenado del nomenclador,
# no está publicado. Todas apuntan a `jerarquia.indices_escalafonarios`, que lo
# declara como Cuestión abierta #4. Lo relevado y por qué no alcanza está en
# `docs/datos-pendientes/relevamiento-2026-11.md`.
#
# `jerarquia` sigue en null y separada del índice: una es un orden abstracto y
# el otro el multiplicador del básico. El art. 41 habla de «mayor jerarquía» y
# la Res. IPS 995/2021 de «mejor remunerado»; que coincidan es parte de lo que
# la Cuestión #4 todavía no fijó.
entradas:
  # ---- Asimilados al frente de alumnos por ley expresa ----
  - cargo: preceptor
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: true
    naturaleza: docente
    norma:
      texto: "Ley 13469 (preceptores y bibliotecarios)"
      ley: "Ley 13469"
    estado: verificado
    regla_id: null
  # Bibliotecario del Instituto de Menores (nomenclador, sección c)
  - cargo: bibliotecario_instituto_menores
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: true
    naturaleza: docente
    norma:
      texto: "Ley 13469 (preceptores y bibliotecarios)"
      ley: "Ley 13469"
    estado: verificado
    regla_id: null
  # Bibliotecario de Enseñanza Superior (nomenclador, sección c)
  - cargo: bibliotecario_ensenanza_superior
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: true
    naturaleza: docente
    norma:
      texto: "Ley 13469 (preceptores y bibliotecarios)"
      ley: "Ley 13469"
    estado: verificado
    regla_id: null
  - cargo: tecnico_docente_psicologia
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: true
    naturaleza: docente
    norma:
      texto: "Ley 10745 (técnico-docentes de Psicología y Educación Especial)"
      ley: "Ley 10745"
    estado: verificado
    regla_id: null
  - cargo: tecnico_docente_educacion_especial
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: true
    naturaleza: docente
    norma:
      texto: "Ley 10745 (técnico-docentes de Psicología y Educación Especial)"
      ley: "Ley 10745"
    estado: verificado
    regla_id: null
  - cargo: visitadora_higiene_escolar
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: true
    naturaleza: docente
    norma:
      texto: "Ley 11860 (visitadoras de higiene escolar)"
      ley: "Ley 11860"
    estado: verificado
    regla_id: null

  # ---- Cargo de base del art. 24 inc. b ----
  - cargo: maestro_de_grado
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: true
    naturaleza: docente
    norma:
      texto: "DL 9650/80, art. 24 inc. b (maestros al frente directo de alumnos)"
      ley: "DL 9650/80"
      articulo: "24"
      inciso: "b"
    estado: verificado
    regla_id: null

  # ---- Horas cátedra: el índice es POR HORA y por nivel ----
  #
  # El nomenclador da un índice distinto por nivel y expresado por hora, no por
  # cargo (Decreto 1301/2005, Anexo I, sección XVI). Por eso van separadas y
  # con `indice_es_por_hora: true`: comparar un índice por hora contra uno por
  # cargo mezcla dos magnitudes y da un resultado que parece válido.
  #
  # La condición de al frente de alumnos no es booleana: el art. 24 inc. b
  # asimila a los profesores que reúnen veinte horas cátedra, y el umbral sale
  # de la regla, no del catálogo.
  - cargo: hora_catedra_secundaria
    jerarquia: null
    indice_escalafonario: null
    indice_es_por_hora: true
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: null
    naturaleza: docente
    norma:
      texto: "DL 9650/80, art. 24 inc. b (profesores con veinte horas cátedra)"
      ley: "DL 9650/80"
      articulo: "24"
      inciso: "b"
    estado: verificado
    condicion: por_horas_catedra
    regla_umbral: requisitos.art24.inc_b
    regla_id: horas_catedra.como_carrera
  - cargo: hora_catedra_adultos
    jerarquia: null
    indice_escalafonario: null
    indice_es_por_hora: true
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: null
    naturaleza: docente
    norma:
      texto: "DL 9650/80, art. 24 inc. b (profesores con veinte horas cátedra)"
      ley: "DL 9650/80"
      articulo: "24"
      inciso: "b"
    estado: verificado
    condicion: por_horas_catedra
    regla_umbral: requisitos.art24.inc_b
    regla_id: horas_catedra.como_carrera
  - cargo: hora_catedra_superior
    jerarquia: null
    indice_escalafonario: null
    indice_es_por_hora: true
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: null
    naturaleza: docente
    norma:
      texto: "DL 9650/80, art. 24 inc. b (profesores con veinte horas cátedra)"
      ley: "DL 9650/80"
      articulo: "24"
      inciso: "b"
    estado: verificado
    condicion: por_horas_catedra
    regla_umbral: requisitos.art24.inc_b
    regla_id: horas_catedra.como_carrera

  # ---- Directivos: fuera de la enumeración del inc. b ----
  #
  # No los nombra el art. 24 inc. b, así que por la letra no cuentan al frente
  # de alumnos. Quedan condicionados por la extensión discutida de la Ley 13469
  # (Cuestión abierta #8, impacto al alza).
  #
  # Van por categoría porque el nomenclador los distingue con índices distintos
  # (Decreto 1301/2005, Anexo I, servicios educativos).
  - cargo: vicedirector_segunda
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: false
    naturaleza: docente
    norma:
      texto: "DL 9650/80, art. 24 inc. b (no incluido en la enumeración)"
      ley: "DL 9650/80"
      articulo: "24"
      inciso: "b"
    estado: verificado
    regla_id: al_frente.ley_13469.extension
  - cargo: vicedirector_primera
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: false
    naturaleza: docente
    norma:
      texto: "DL 9650/80, art. 24 inc. b (no incluido en la enumeración)"
      ley: "DL 9650/80"
      articulo: "24"
      inciso: "b"
    estado: verificado
    regla_id: al_frente.ley_13469.extension
  - cargo: director_tercera
    jerarquia: null
    indice_escalafonario: null
    regla_indice: jerarquia.indices_escalafonarios
    al_frente_de_alumnos: false
    naturaleza: docente
    norma:
      texto: "DL 9650/80, art. 24 inc. b (no incluido en la enumeración)"
      ley: "DL 9650/80"
