#
# T042 — Las Cuestiones abiertas de la constitución todavía sin resolver,
# como reglas.
#
# La #1 (escala de antigüedad) se resolvió el 2026-11-04 con la evidencia de
# una liquidación real y se mudó a `haber.yaml` como regla verificada. Las
# que quedan son la #2, #3, #4, #5, #6 y #9.
#
# Todas llevan `valor: null`. Ninguna lleva un valor tentativo: el motor emite
# el resultado marcado como provisional y explica qué falta verificar
# (FR-046 a FR-046c), que es preferible a un número que parece correcto.

reglas:
  # Cuestión abierta #2 — sigue abierta, con mejor default desde 2026-11-04.
  #
  # El criterio pasó de «todos los componentes del cargo» a **los componentes
  # con aporte al IPS**, y el cambio no es una reinterpretación de la norma sino
  # una observación: la liquidación DGCyE 09/2026 muestra el aporte personal
  # (código 1060) como el 16 % exacto de la suma de básico + antigüedad +
  # bonificación remunerativa docente + bonificación no jerárquica, y la
  # bonificación no remunerativa compensatoria (2575) queda afuera de esa base.
  #
  # Por qué es un default mejor y no solo distinto: los arts. 4 y 5 atan el
  # sistema al aporte, y el Estado ya decidió mes a mes sobre qué conceptos se
  # aporta. Es un criterio **verificable contra el recibo**, que la letra del
  # art. 40 no es.
  #
  # Por qué **sigue sin verificarse**: que un concepto tribute no prueba que
  # integre el haber. La correspondencia entre base de aporte y base de haber es
  # exactamente lo que falta, y lo tiene que decir una resolución del IPS, no un
  # recibo de actividad. Todo haber sigue saliendo provisional.
  - id: remuneracion.conceptos_del_cargo
    norma:
      texto: >-
        DL 9650/80, arts. 4 y 5 (obligatoriedad del aporte y conceptos sujetos
        a aporte) y art. 40 (remuneración asignada al cargo)
      ley: "DL 9650/80"
      articulo: "4, 5 y 40"
    tipo: letra_ley
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    magnitud_estimada: >-
      la diferencia es el conjunto de componentes no remunerativos sin aporte;
      en la liquidación relevada, un concepto compensatorio de suma fija
    evidencia: >-
      liquidación DGCyE 09/2026: el código 1060 (aporte personal al IPS) es el
      16 % exacto de la suma de los códigos 0110, 0220, 0455 y 0667. El código
      2575 (bonificación no remunerativa compensatoria) no integra esa base
    que_falta_verificar: >-
      si la base de cálculo del **haber** coincide con la base del **aporte**.
      Que un concepto tribute al IPS es observable en el recibo; que por eso
      integre la remuneración del cargo del art. 40 es una inferencia, y la
      tiene que confirmar una resolución del IPS sobre un haber liquidado.

      El motor aplica por defecto los **componentes con aporte al IPS**, que es
      el criterio verificable contra el recibo. La lectura más amplia —incluir
      también los no remunerativos sin aporte, como el FONID o la Conectividad—
      queda informada como alternativa al alza
      (`remuneracion.incluye_no_remunerativos_sin_aporte`).

      Las exclusiones expresas del art. 40 —horas extras, asignaciones
      familiares, viáticos, gastos de residencia y becas— siguen aplicándose en
      cualquiera de las dos lecturas, y las declara la grilla con
      `excluido_art40`.
    cuestion_abierta: 2
    valor_por_defecto_aplicado: true
    valor:
      criterio_aplicado: "componentes_con_aporte_ips"
      alicuota_aporte_personal: "0.16"
      componentes_con_aporte_verificados:
        - "0110"
        - "0220"
        - "0455"
        - "0667"
      componentes_sin_aporte_verificados:
        - "2575"
      excluidos:
        - "horas extras"
        - "asignaciones familiares"
        - "viáticos"
        - "gastos de residencia"
        - "becas"

  # Cuestión abierta #3, segunda parte: la equivalencia módulo ↔ hora cátedra.
  #
  # El nivel secundario liquida por **módulos** y el art. 24 inc. b habla de
  # **horas cátedra**. Sin una equivalencia el umbral de veinte no se puede
  # evaluar para una docente por módulos, que es la mitad del nivel.
  #
  # El valor por defecto —1 módulo = 1,5 horas cátedra— sale de la duración: el
  # módulo es de 60 minutos y la hora cátedra de 40, así que dos módulos son
  # tres horas cátedra. Es la práctica administrativa de la DGCyE y es
  # aritméticamente coherente, pero **no se encontró la norma que la fije** a
  # los efectos previsionales, y de eso depende si una docente con 14 módulos
  # (21 horas) alcanza el umbral o no lo alcanza (14 horas).
  #
  # Cómo lo trata el motor: evalúa el umbral bajo **las dos** lecturas. Si el
  # resultado coincide, el inciso sale definitivo y la cuestión no lo
  # condiciona; si cambia, sale provisional y el informe muestra las dos. Una
  # regla sin verificar que no mueve el resultado es informativa, no bloqueante.
  - id: modulos.equivalencia_horas_catedra
    norma:
      texto: >-
        Práctica administrativa DGCyE (módulo de 60 minutos, hora cátedra de 40
        minutos) a los efectos del umbral del art. 24 inc. b del DL 9650/80
      ley: "Práctica administrativa DGCyE"
      articulo: "24"
      inciso: "b"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    magnitud_estimada: >-
      1,5 contra 1,0 hora cátedra por módulo: con 14 módulos la diferencia es
      21 horas contra 14, a los dos lados del umbral de 20
    evidencia: >-
      liquidación DGCyE 09/2026: la carga horaria de un cargo de nivel
      secundario se expresa en módulos y no en horas cátedra, lo que hace
      necesaria la equivalencia. La liquidación no la documenta
    que_falta_verificar: >-
      la norma que fija la equivalencia entre módulo y hora cátedra **a los
      efectos previsionales**. La relación 1 módulo = 1,5 horas cátedra se
      desprende de las duraciones (60 y 40 minutos) y es la práctica
      administrativa de la DGCyE, pero no se encontró el acto que la establezca
      para el cómputo del art. 24 inc. b.

      El motor aplica 1,5 por defecto y evalúa el umbral también con la lectura
      conservadora de 1 módulo = 1 hora cátedra
      (`modulos.equivalencia_uno_a_uno`). El inciso sale provisional solo si las
      dos lecturas difieren en el resultado.
    cuestion_abierta: 3
    valor_por_defecto_aplicado: true
    valor:
      horas_catedra_por_modulo: "1.5"
      minutos_modulo: 60
      minutos_hora_catedra: 40

  # Cuestión abierta #3
  - id: horas_catedra.como_carrera
    norma:
      texto: "Res. HD IPS 8/14"
      ley: "Res. HD IPS 8/14"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    que_falta_verificar: >-
      el contenido de la Res. HD IPS 8/14 y su aplicación a las horas cátedra y
      los módulos a los efectos del cargo base.
    cuestion_abierta: 3
    valor: null

  # Cuestión abierta #4
  - id: jerarquia.criterio_comparacion
    norma:
      texto: >-
        Res. IPS 995/2021, Anexo, definición de CARGO BASE (cargo mejor
        remunerado); Res. IPS 14/10 (acreditación de mayor jerarquía)
      ley: "Res. IPS 995/2021"
      articulo: "Anexo, definición de CARGO BASE"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    magnitud_estimada: >-
      cambia qué cargo resulta base y, con él, el artículo y el porcentaje:
      hasta 70 % contra 85 % según el inciso de acceso
    que_falta_verificar: >-
      el criterio para comparar la jerarquía entre cargos —puntaje, índice
      escalafonario o remuneración— y su acreditación. El motor aplica por
      defecto el **mejor remunerado** del Anexo de la Res. IPS 995/2021, que
      tiene la ventaja de ser verificable contra la grilla sin necesitar el
      escalafón. Sin grilla usa el índice escalafonario del nomenclador como
      desempate, y sin ninguno de los dos declara el empate.
    cuestion_abierta: 4
    valor_por_defecto_aplicado: true
    valor:
      criterio_aplicado: "mejor_remunerado"

  # Cuestión abierta #5 (incluye la ampliación sobre situación de revista)
  - id: computo.licencias_suplencias_y_revista
    norma:
      texto: "DL 9650/80, art. 41 (cargo «de que era titular»)"
      ley: "DL 9650/80"
      articulo: "41"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    que_falta_verificar: >-
      el tratamiento de licencias con y sin goce, suplencias e interinatos en el
      cómputo de los 36/60 meses y de los años de servicio, y si la situación de
      revista (titular, provisional, suplente) condiciona la elección del cargo
      base, dado que el art. 41 se refiere al cargo «de que era titular».
    cuestion_abierta: 5
    valor: null

  # Cuestión abierta #5 — la convención de conteo del tiempo de servicio.
  #
  # A diferencia de las demás reglas de este archivo, acá `valor` NO va en null:
  # el motor no puede *no* contar el tiempo. Tuvo que elegir una convención, y
  # la elección se declara —con `valor_por_defecto_aplicado: true`— en lugar de
  # quedar escondida en el código. El resultado de todo requisito que dependa
  # de ella y esté cerca del umbral sale provisional (FR-046b).
  - id: computo.convencion_de_conteo
    norma:
      texto: "DL 9650/80, art. 24 (cómputo de años de servicio) — convención no documentada"
      ley: "DL 9650/80"
      articulo: "24"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    que_falta_verificar: >-
      la convención con que el IPS computa el tiempo de servicio: días
      calendario reales o meses de 30 días; si la fecha final del período es
      inclusiva o exclusiva; y si los días residuales de cada tramo se arrastran
      a meses. El motor aplica por defecto días reales con fecha final inclusiva
      y sin arrastre, y marca como provisional todo requisito cuyo margen al
      umbral sea menor o igual que el desplazamiento que el cambio de convención
      puede producir.
    cuestion_abierta: 5
    valor_por_defecto_aplicado: true
    valor:
      convencion: "dias_reales"
      fecha_final: "inclusiva"
      arrastre_de_dias: false
      dias_por_mes_alternativa: 30

  # Cuestión abierta #6
  - id: redondeo.politica_ips
    norma:
      texto: "Política de redondeo aplicada por el IPS en la liquidación del haber"
      ley: "Práctica administrativa IPS"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    que_falta_verificar: >-
      la política de redondeo que aplica el IPS. El motor usa un único
      `quantize()` centralizado con ROUND_HALF_UP declarado por defecto, y el
      último decimal no está garantizado hasta verificarlo.
    cuestion_abierta: 6
    valor_por_defecto_aplicado: true
    valor:
      politica_aplicada: "ROUND_HALF_UP"
      decimales: 2

  # Cuestión abierta #9
  #
  # La docente cumple el art. 24 inc. b por sus años al frente de alumnos, pero
  # su cargo base del art. 41 es un cargo que no cuenta al frente —un
  # directivo—. Las dos lecturas son defendibles: el art. 43 rige «el personal
  # del art. 24 inc. b», y ella lo es; pero su 75 % se pensó para el cargo al
  # frente de alumnos, que no es el cargo base.
  #
  # Se aplica el 70 % del art. 41 por ser el criterio más conservador. De los
  # dos errores posibles, prometer un haber mayor que el que el IPS liquida es
  # el que le cuesta plata al docente.
  - id: porcentaje.art43.cargo_base_no_al_frente
    norma:
      texto: >-
        DL 9650/80, arts. 41 y 43 (acceso por el inc. b con cargo base que no
        cuenta al frente de alumnos)
      ley: "DL 9650/80"
      articulo: "41-43"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    magnitud_estimada: "70 % vs 75 % sobre el cargo base"
    que_falta_verificar: >-
      si cuando la docente cumple el art. 24 inc. b por sus años al frente de
      alumnos, pero el cargo base del art. 41 es un cargo que no cuenta al
      frente, corresponde el 75 % del art. 43 sobre ese cargo base o el 70 %
      del art. 41. El motor aplica el 70 % por ser el criterio más
      conservador, y lo declara como valor por defecto aplicado.
    cuestion_abierta: 9
    valor_por_defecto_aplicado: true
    valor:
      criterio_aplicado: "art_41"

  # Cuestión abierta #4, segunda mitad: los **valores** de los índices.
  #
  # La #4 tiene dos partes y conviene distinguirlas. Una es el **criterio** para
  # comparar cargos —puntaje, índice escalafonario o remuneración—, que es
  # `jerarquia.criterio_comparacion`. La otra es que, aun eligiendo el índice
  # como criterio, los índices vigentes por cargo **no están publicados**: el
  # Anexo del art. 9º del Decreto 2397/2005, que aprueba el texto ordenado del
  # nomenclador, no figura en la versión en línea de la norma.
  #
  # Lo que sí se encontró, con sus citas, y por qué no alcanza, está en
  # `docs/datos-pendientes/relevamiento-2026-11.md`.
  - id: jerarquia.indices_escalafonarios
    norma:
      texto: >-
        Decreto 2397/2005, art. 9º (texto ordenado del nomenclador de cargos
        docentes); Decreto 1301/2005, Anexo I
      ley: "Decreto 2397/2005"
      articulo: "9"
    tipo: interpretacion
    estado: no_verificada
    impacto_si_no_verificada: indeterminado
    magnitud_estimada: >-
      cambia qué cargo resulta base y, con él, el artículo y el porcentaje:
      hasta 70 % contra 85 % según el inciso de acceso
    que_falta_verificar: >-
      el índice escalafonario vigente de cada cargo. El Anexo del art. 9º del
      Decreto 2397/2005 no está publicado en línea. El Decreto 1301/2005,
      Anexo I, trae índices de abril de 2005 que el Decreto 2397/2005 modificó
      —art. 2º los lleva de 1 a 1,1 y art. 3º incrementa 20 % los jerárquicos—,
      y para Director, Vicedirector y Bibliotecario da **rangos** según
      categoría del establecimiento y cantidad de secciones, no un valor único.
      Sin los índices el motor no puede comparar cargos ni por jerarquía ni por
      remuneración, y el cargo base queda provisional.
    cuestion_abierta: 4
    valor: null
