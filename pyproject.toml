# Último Timbre — motor de cálculo de jubilación ordinaria docente (IPS PBA)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultimo-timbre"
version = "0.1.0"
description = "Motor de cálculo de la jubilación ordinaria docente del IPS de la Provincia de Buenos Aires"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Último Timbre" }]
keywords = ["jubilacion", "docente", "ips", "previsional", "buenos-aires"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.9",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.scripts]
ultimo-timbre = "ultimo_timbre.cli.main:app"

[project.urls]
Homepage = "https://github.com/valenventos/ultimo-timbre-motor"
Issues = "https://github.com/valenventos/ultimo-timbre-motor/issues"

# ---------------------------------------------------------------------------
# Dependencias de desarrollo (uv)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
  # pruebas
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "jsonschema>=4.23",
  # validación de datos normativos
  "check-jsonschema>=0.29",
  # calidad
  "ruff>=0.7",
  "mypy>=1.13",
  # seguridad y cumplimiento
  "bandit>=1.7",
  "pip-audit>=2.7",
  "reuse>=4.0",
  "cyclonedx-bom>=4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ultimo_timbre"]

# ---------------------------------------------------------------------------
# T005 — ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # flake8-bugbear
  "A",           # flake8-builtins
  "C4",          # flake8-comprehensions
  "DTZ",         # flake8-datetimez
  "PT",          # flake8-pytest-style
  "RET",         # flake8-return
  "SIM",         # flake8-simplify
  "ARG",         # flake8-unused-arguments
  "PTH",         # flake8-use-pathlib
  "ERA",         # eradicate
  "PL",          # pylint
  "RUF",         # ruff
]
ignore = [
  "PLR0913",     # demasiados argumentos: los modelos de dominio los necesitan
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # comparar contra literales es normal en un test

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["types"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# T006 — mypy strict + plugin de Pydantic v2 (research R9)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ultimo_timbre"]
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true

# Sin el plugin de Pydantic, strict produce falsos positivos sobre los campos y
# validadores generados, y el resultado son `# type: ignore` en masa — que es
# justamente lo que vuelve inútil el modo strict.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# El motor es el núcleo auditable: ahí `Any` explícito está prohibido.
[[tool.mypy.overrides]]
module = ["ultimo_timbre.engine.*", "ultimo_timbre.rules.*"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = ["dateutil.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# T007 — pytest y cobertura de ramas
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=ultimo_timbre",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
markers = [
  "golden: caso real del IPS anonimizado o caso sintético de referencia",
  "slow: tarda más de un segundo",
]

[tool.coverage.run]
branch = true
source = ["ultimo_timbre"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

# Umbral global: 80 %. El umbral reforzado de 95 % en `engine` y `rules` NO se
# puede expresar acá —`--cov-fail-under` es un único valor global— así que se
# verifica como paso aparte, en CI y con `make cobertura`:
#
#   coverage report --include="src/ultimo_timbre/engine/*,src/ultimo_timbre/rules/*" \
#                   --fail-under=95
#
# Ver el paso "Cobertura de motor y reglas" del job `tests` en
# .github/workflows/ci.yml (Principio VI).

[tool.coverage.paths]
source = ["src/ultimo_timbre", "*/site-packages/ultimo_timbre"]

# ---------------------------------------------------------------------------
# bandit (SAST) — los tests quedan fuera del escaneo
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
